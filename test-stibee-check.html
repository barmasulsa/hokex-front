<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스티비 구독자 확인 테스트</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>스티비 구독자 확인 테스트</h1>
    <p>이메일 주소를 입력하여 스티비 API 응답을 확인하세요.</p>
    
    <input type="email" id="emailInput" placeholder="이메일 주소 입력">
    <button onclick="checkSubscription()">구독자 확인</button>
    
    <div id="result"></div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

        // 환경 변수 입력 (실제 값으로 교체)
        const SUPABASE_URL = prompt('Supabase URL을 입력하세요:');
        const SUPABASE_ANON_KEY = prompt('Supabase Anon Key를 입력하세요:');

        if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
            document.getElementById('result').innerHTML = '❌ Supabase 설정이 필요합니다.';
            document.getElementById('result').className = 'error';
        }

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.checkSubscription = async function() {
            const email = document.getElementById('emailInput').value;
            const resultDiv = document.getElementById('result');
            
            if (!email) {
                resultDiv.innerHTML = '❌ 이메일을 입력해주세요.';
                resultDiv.className = 'error';
                return;
            }

            resultDiv.innerHTML = '⏳ 확인 중...';
            resultDiv.className = '';

            try {
                console.log('Checking subscription for:', email);
                
                const { data, error } = await supabase.functions.invoke('check-stibee-subscriber', {
                    body: { email },
                });

                console.log('Response:', { data, error });

                if (error) {
                    resultDiv.innerHTML = `❌ 에러 발생:\n${JSON.stringify(error, null, 2)}`;
                    resultDiv.className = 'error';
                    return;
                }

                if (data.isSubscriber) {
                    resultDiv.innerHTML = `✅ 구독자입니다!\n\n상세 정보:\n${JSON.stringify(data, null, 2)}`;
                    resultDiv.className = 'success';
                } else {
                    resultDiv.innerHTML = `❌ 구독자가 아닙니다.\n\n상세 정보:\n${JSON.stringify(data, null, 2)}`;
                    resultDiv.className = 'error';
                }
            } catch (err) {
                console.error('Error:', err);
                resultDiv.innerHTML = `❌ 예외 발생:\n${err.message}\n\n${JSON.stringify(err, null, 2)}`;
                resultDiv.className = 'error';
            }
        }
    </script>
</body>
</html>
