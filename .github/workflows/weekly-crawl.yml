name: Weekly Exhibition Crawl

on:
  schedule:
    # 매주 월요일 오전 3시 (KST 기준, UTC는 -9시간이므로 일요일 18:00)
    - cron: '0 18 * * 0'
  workflow_dispatch: # 수동 실행 가능

jobs:
  crawl:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hokex-crawler/package-lock.json

      - name: Install dependencies
        working-directory: hokex-crawler
        run: npm ci

      - name: Run crawlers
        working-directory: hokex-crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npx tsx src/scripts/auto-crawl-all.ts

      - name: Notify completion
        if: success()
        run: |
          echo "✅ 크롤링 완료: $(date)"
          echo "🌐 웹사이트: https://hokex-front.vercel.app/"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ 크롤링 실패: $(date)"
